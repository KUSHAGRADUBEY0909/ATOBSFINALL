<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus timings · ATOBS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="timings">
<header id="top"></header>
<main class="wrap">
  <section class="hero">
    <h1>Bus timings</h1>
    <p>Every direct BMTC bus between two places: the dataset timetable plus a bus every 10 minutes at peak (7–11, 17–21) and every 15 minutes otherwise. Arrival times adjust for typical traffic at that hour.</p>
    <form id="f" class="card" style="display:grid;grid-template-columns:1fr auto 1fr 130px 150px auto;gap:.6rem;align-items:end">
      <div><label for="from">From</label><input id="from" placeholder="e.g. Kempegowda Bus Station" autocomplete="off" required></div>
      <button class="btn" type="button" id="swap" title="Swap" style="margin-bottom:1px">⇄</button>
      <div><label for="to">To</label><input id="to" placeholder="e.g. Yelahanka" autocomplete="off" required></div>
      <div><label for="at">Time</label><input id="at" type="time" title="Leave empty for now"></div>
      <div><label for="win">Show next</label><select id="win"><option value="60">1 hour</option><option value="120" selected>2 hours</option><option value="240">4 hours</option></select></div>
      <button class="btn primary">Find buses</button>
    </form>
    <div class="row" style="margin-top:.6rem;gap:.4rem" id="quick"></div>
  </section>

  <div id="out" style="margin-top:1rem"></div>
</main>
<script src="/js/common.js"></script>
<script>
const { api, esc } = ATOBS;
const $ = (id) => document.getElementById(id);
let last = null, filter = "all", timer = null, selected = 0;

ATOBS.placeAutocomplete($("from"));
ATOBS.placeAutocomplete($("to"));
$("swap").onclick = () => { const a = $("from").value; $("from").value = $("to").value; $("to").value = a; };
[["Kempegowda Bus Station", "Yelahanka"], ["Banashankari TTMC", "Central Silk Board"], ["Krishnarajendra Market", "Kengeri TTMC"], ["Shivajinagar Bus Station", "K R Puram"]]
  .forEach(([a, b]) => {
    const btn = document.createElement("button");
    btn.className = "btn sm"; btn.type = "button";
    btn.textContent = `${a} → ${b}`;
    btn.onclick = () => { $("from").value = a; $("to").value = b; search(); };
    $("quick").appendChild(btn);
  });

$("f").onsubmit = (e) => { e.preventDefault(); search(); };

async function search(keepSel) {
  const a = $("from").value.trim(), b = $("to").value.trim();
  if (!a || !b) return;
  const at = $("at").value;
  history.replaceState(null, "", `?from=${encodeURIComponent(a)}&to=${encodeURIComponent(b)}${at ? "&at=" + at : ""}`);
  if (!keepSel) { selected = 0; $("out").innerHTML = '<div class="card empty">Finding buses…</div>'; }
  try {
    last = await api(`/api/journey?origin=${encodeURIComponent(a)}&destination=${encodeURIComponent(b)}&window=${$("win").value}${at ? "&at=" + at : ""}`);
  } catch (e) { $("out").innerHTML = `<div class="card error">${esc(e.message)}</div>`; return; }
  render();
  clearTimeout(timer);
  if (!at) timer = setTimeout(() => search(true), 30000); // live refresh
}

function occ(p) { return `<span class="occ-badge ${ATOBS.occClass(p)}" style="font-size:1.25rem">${p}<small>%</small></span>`; }

function render() {
  const d = last;
  if (!d.routes.length) {
    $("out").innerHTML = `<div class="card empty"><h2>No direct bus</h2><p>No single route connects <b>${esc(d.origin)}</b> and <b>${esc(d.destination)}</b>. Pick names from the suggestions, or try a nearby major stop.</p></div>`;
    return;
  }
  const deps = d.departures.filter((x) => filter === "all" || (filter === "tt" ? x.kind === "timetable" : x.kind !== "timetable"));
  const next = deps[0];
  $("out").innerHTML = `
  <div class="grid g4">
    <div class="card stat"><div class="k">Direct routes</div><div class="v">${d.routes.length}</div></div>
    <div class="card stat"><div class="k">Next bus</div><div class="v">${next ? (next.minutes_away ? next.minutes_away + " min" : "Now") : "–"}</div></div>
    <div class="card stat"><div class="k">Buses in next ${d.window_minutes / 60} h</div><div class="v">${d.total_upcoming}</div></div>
    <div class="card stat"><div class="k">Traffic now (${d.now})</div><div class="v" style="font-size:1.1rem;padding-top:.4rem">${d.traffic_factor_now > 1.03 ? "Slower than usual ×" + d.traffic_factor_now : d.traffic_factor_now < 0.97 ? "Faster than usual ×" + d.traffic_factor_now : "Normal"}${d.headway_now ? `<br><small class="muted">every ${d.headway_now} min per route</small>` : ""}</div></div>
  </div>
  <div class="split" style="margin-top:1rem">
    <section class="card">
      <div class="row"><h2 style="margin:0">Departures from ${esc(d.origin)}</h2><span class="spacer"></span>
        <div class="seg" id="filt"><button data-f="all" class="${filter === "all" ? "on" : ""}">All</button><button data-f="tt" class="${filter === "tt" ? "on" : ""}">Timetable</button><button data-f="freq" class="${filter === "freq" ? "on" : ""}">10/15-min service</button></div></div>
      <p class="muted" style="margin:.3rem 0 0">Towards ${esc(d.destination)} · ${$("at").value ? "at " + $("at").value : "live, refreshes every 30 s"} · tap a bus to see its seats</p>
      <div id="deps">${deps.map((x, i) => `
        <div class="dep click" data-i="${d.departures.indexOf(x)}" style="cursor:pointer;${d.departures.indexOf(x) === selected ? "background:#eef6f6" : ""}">
          <div class="when"><b>${x.minutes_away || "Now"}</b><small>${x.minutes_away ? "min" : ""}</small></div>
          <div>
            <div class="row" style="gap:.4rem"><span class="pill route">${esc(x.route_id)}</span><b>towards ${esc(x.towards)}</b></div>
            <small>Here at <b>${x.expected_at_stop}</b>${x.expected_at_stop !== x.scheduled_at_stop ? ` <s class="muted">${x.scheduled_at_stop}</s>` : ""} · ${esc(x.status)} · left ${esc(x.from_terminal)} ${x.terminal_departure}</small><br>
            <span class="pill ${x.kind === "timetable" ? "kind-tt" : "kind-freq"}">${x.kind === "timetable" ? "Timetable" : esc(x.kind)}</span>
            ${x.live_buses.length ? x.live_buses.map((b) => `<span class="pill live">${esc(b.registration)} ${b.current_onboard}/${b.capacity}</span>`).join(" ") : ""}
          </div>
          <div class="arr"><small class="muted">Arrive</small><br><b>${x.arrive_destination}</b><br><small>${x.ride_minutes} min · ${x.stops_between} stops</small></div>
          <div class="crowd">${occ(x.occupancy_pct)}<br><small>${x.seats_occupied}/40 seats · ${esc(x.crowd_label)}</small></div>
        </div>`).join("") || '<div class="empty">No buses of this type in this window.</div>'}</div>
    </section>
    <aside>
      <section class="card" id="seatCard"></section>
      <section class="card">
        <h2>All buses between these places</h2>
        <div style="overflow:auto;max-height:520px"><table><thead><tr><th>Route</th><th>From → towards</th><th>First</th><th>Last</th><th>Trips/day</th><th>Ride</th></tr></thead><tbody>
        ${d.routes.map((r) => `<tr><td><a class="pill route" style="text-decoration:none" href="/route.html?id=${encodeURIComponent(r.route_id)}">${esc(r.route_id)}</a></td>
          <td><small>${esc(r.from_terminal)} → ${esc(r.towards)}</small></td><td class="mono">${r.first_bus || "–"}</td><td class="mono">${r.last_bus || "–"}</td>
          <td>${r.trips_per_day}<br><small class="muted">${r.timetable_trips} in timetable</small></td><td>${r.ride_minutes} min</td></tr>`).join("")}
        </tbody></table></div>
        <small class="muted">Trips/day = dataset timetable trips + 10/15-minute service between 05:30 and 23:00.</small>
      </section>
    </aside>
  </div>`;
  $("filt").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.f; render(); };
  $("deps").onclick = (e) => { const r = e.target.closest("[data-i]"); if (!r) return; selected = +r.dataset.i; render(); };
  showSeats(d.departures[selected] || deps[0]);
}

async function showSeats(x) {
  if (!x) { $("seatCard").innerHTML = ""; return; }
  await ATOBS.seatsReady;
  const liveBus = x.live_buses[0];
  $("seatCard").innerHTML = `<div class="row"><h2 style="margin:0">Route ${esc(x.route_id)} at ${x.expected_at_stop}</h2></div>
    <p class="muted" style="margin:.2rem 0 .6rem">${liveBus ? "Live camera count on " + esc(liveBus.registration) : "Predicted from " + "the ATOBS crowd model for this stop and time"}</p>
    <div class="row" style="align-items:flex-start;gap:1.2rem"><div id="sm"></div>
      <div><div class="k muted" style="font-size:.75rem;text-transform:uppercase">Occupancy</div>${occ(liveBus ? Math.round(100 * liveBus.current_onboard / liveBus.capacity) : x.occupancy_pct)}
      <p style="max-width:160px"><small>${esc(x.crowd_label)}. Green seats are free, red are taken.</small></p></div></div>`;
  if (liveBus) ATOBS.seatMap(document.getElementById("sm"), { occupied: Math.min(40, liveBus.current_onboard), standing: Math.max(0, liveBus.current_onboard - 40), seed: liveBus.registration });
  else ATOBS.seatMap(document.getElementById("sm"), { occupied: x.seats_occupied, pct: x.occupancy_pct, seed: x.route_id + x.terminal_departure });
}

(() => {
  const f = ATOBS.qs("from"), t = ATOBS.qs("to"), at = ATOBS.qs("at");
  if (at) $("at").value = at;
  if (f && t) { $("from").value = f; $("to").value = t; search(); }
})();
</script>
</body>
</html>
